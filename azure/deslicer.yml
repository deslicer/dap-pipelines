parameters:
  - name: serviceConnection
    type: string
  - name: observerApiUrl
    type: string
    default: 'https://api.deslicer.ai'
  - name: environments
    type: object
  - name: deslicerVersion
    type: string
    default: 'v1.0.0'

stages:
  - ${{ each env in parameters.environments }}:
    - stage: deslicer_${{ env }}
      dependsOn: []
      jobs:
        - deployment: deslicer_change_${{ env }}
          environment: ${{ env }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - template: _steps/install-deslicer.yml
                    parameters:
                      version: ${{ parameters.deslicerVersion }}
                  - task: AzureCLI@2
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        export DESLICER_OIDC_TOKEN="$(az account get-access-token --resource ${{ parameters.observerApiUrl }} --query accessToken -o tsv)"
                        deslicer change plan --environment ${{ env }}
                    env:
                      OBSERVER_API_URL: ${{ parameters.observerApiUrl }}
