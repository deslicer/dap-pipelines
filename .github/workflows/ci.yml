name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6
      - name: Required files exist
        run: |
          test -f gitlab/deslicer.gitlab-ci.yml
          test -f azure/deslicer.yml
          test -f azure/_steps/install-deslicer.yml
          test -f bitbucket/deslicer-snippet.yml
